name: Office website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'scripts/build-office-website.mjs'
      - '.github/workflows/office-website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: office-website-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-office-website.mjs
      - uses: actions/configure-pages@v5
        if: vars.OFFICE_WEBSITE_PUBLISH == 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: vars.OFFICE_WEBSITE_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
